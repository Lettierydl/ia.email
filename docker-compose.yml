services:
  radar:
    build: .
    container_name: ia-email
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - path: /Users/leo/Learning Base/credenciais/.env
        required: true
      - path: .env
        required: false
    environment:
      RADAR_BIND: "0.0.0.0"
      RADAR_HOST: "127.0.0.1"
      RADAR_PUBLIC_HOST: "127.0.0.1"
      RADAR_PORT: "8765"
      RADAR_ACCOUNT: "leo@confrapag.com.br"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./static:/app/static
      # Learning Base inteira, so leitura -- usada pela base de contexto
      # "geral" das Configuracoes. principal_agents/ e montada de novo por
      # cima, em leitura/escrita: e' onde "Guardar no cerebro" escreve,
      # escolhendo a categoria certa (financas, demandas-projetos, emails
      # etc) em vez de sempre em emails/ (o mount mais especifico vence
      # sobre o pai). lb-company/ e lb-personal/ continuam so leitura --
      # sao vaults com convenc-o-es proprias, fora do escopo de escrita
      # automatica deste app.
      - "/Users/leo/Learning Base:/Users/leo/Learning Base:ro"
      - "/Users/leo/Learning Base/principal_agents:/Users/leo/Learning Base/principal_agents"
