services:
  radar:
    build: .
    container_name: ia-email
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - path: /Users/leo/Learning Base/credenciais/.env
        required: true
      - path: .env
        required: false
    environment:
      RADAR_BIND: "0.0.0.0"
      RADAR_HOST: "127.0.0.1"
      RADAR_PUBLIC_HOST: "127.0.0.1"
      RADAR_PORT: "8765"
      RADAR_ACCOUNT: "leo@confrapag.com.br"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./static:/app/static
      # Learning Base inteira, so leitura -- usada pela base de contexto
      # "geral" das Configuracoes. A pasta emails/ é montada de novo por
      # cima, em leitura/escrita, pra manter os exports e o context.md
      # funcionando (o mount mais especifico vence sobre o pai).
      - "/Users/leo/Learning Base:/Users/leo/Learning Base:ro"
      - "/Users/leo/Learning Base/principal_agents/emails:/Users/leo/Learning Base/principal_agents/emails"
