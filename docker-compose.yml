services:
  radar:
    build: .
    container_name: ia-email
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - path: /Users/leo/Learning Base/credenciais/.env
        required: true
      - path: .env
        required: false
    environment:
      RADAR_BIND: "0.0.0.0"
      RADAR_HOST: "127.0.0.1"
      RADAR_PUBLIC_HOST: "127.0.0.1"
      RADAR_PORT: "8765"
      RADAR_ACCOUNT: "leo@confrapag.com.br"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./static:/app/static
      # Learning Base inteira, so leitura por padrao -- usada pela base de
      # contexto "geral" das Configuracoes. principal_agents/, lb-company/
      # e lb-personal/ sao montadas de novo por cima, em leitura/escrita
      # (o mount mais especifico vence sobre o pai): e' onde "Guardar no
      # cerebro" e "Exportar contexto" escrevem, escolhendo o destino certo
      # em qualquer parte da base (produto, area da empresa, pessoal/
      # profissional, agente recorrente) em vez de sempre em emails/.
      # credenciais/ (e qualquer outra pasta nova) continuam so leitura.
      - "/Users/leo/Learning Base:/Users/leo/Learning Base:ro"
      - "/Users/leo/Learning Base/principal_agents:/Users/leo/Learning Base/principal_agents"
      - "/Users/leo/Learning Base/lb-company:/Users/leo/Learning Base/lb-company"
      - "/Users/leo/Learning Base/lb-personal:/Users/leo/Learning Base/lb-personal"
